<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
    <main>
        <h1>Emotion Detector</h1>
        <form id="emotion-form" action="{{ url_for('analyze_emotion') }}" method="get">
            <label for="textToAnalyze">Enter English text to analyze</label>
            <textarea id="textToAnalyze" name="textToAnalyze" rows="4"></textarea>
            <button type="submit">Analyze emotions</button>
        </form>
        <section aria-labelledby="result-heading">
            <h2 id="result-heading">Result</h2>
            <p id="system_response" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
